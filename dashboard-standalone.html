<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CV Attendance</title>
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--border:#2e3344;--text:#e8eaf0;--text-dim:#8a8fa3;--accent:#4f8ff7;--green:#34d399;--red:#f87171;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Segoe UI,sans-serif;background:var(--bg);color:var(--text);padding:20px}
header{display:flex;align-items:center;gap:20px;margin-bottom:20px}
header h1{font-size:1.3rem}header h1 span{color:var(--accent)}
.stats{display:flex;gap:16px;font-size:.85rem}
.badge{padding:2px 10px;border-radius:999px;font-size:.75rem;font-weight:600}
.badge.green{background:rgba(52,211,153,.15);color:var(--green)}
.badge.orange{background:rgba(251,191,36,.15);color:#fbbf24}
.badge.dim{background:var(--border);color:var(--text-dim)}
.cam-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:4px 12px;cursor:pointer;font-size:1.1rem}
.grid{display:grid;grid-template-columns:1fr 380px;gap:20px}
.video-card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden}
.card-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;font-size:.9rem}
.live{color:var(--green);font-size:.8rem;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite}
@keyframes pulse{50%{opacity:.3}}
.feed{width:100%;aspect-ratio:4/3;background:#000}
.feed img{width:100%;height:100%;object-fit:cover}
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:12px}
.card .card-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;font-size:.85rem}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th{text-align:left;padding:6px 10px;color:var(--text-dim);border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface)}
td{padding:5px 10px;border-bottom:1px solid var(--border)}
.table-wrap{max-height:300px;overflow-y:auto}
.status{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.7rem;font-weight:600}
.status.in{background:rgba(52,211,153,.15);color:var(--green)}
.status.out{background:rgba(248,113,113,.15);color:var(--red)}
.btn{padding:4px 12px;border:none;border-radius:6px;font-size:.8rem;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{background:var(--red);color:#fff;font-size:.7rem;padding:2px 8px}
.btn.sm{padding:2px 8px;font-size:.7rem}
.empty{text-align:center;padding:20px;color:var(--text-dim);font-size:.85rem}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;justify-content:center;align-items:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;min-width:320px}
.modal h3{margin-bottom:12px}
.modal label{display:block;font-size:.85rem;margin-bottom:4px;color:var(--text-dim)}
.modal input[type=text]{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);outline:none;margin-bottom:8px}
.modal .hint{font-size:.75rem;color:var(--text-dim);margin-bottom:12px}
.btn-row{display:flex;gap:8px;justify-content:flex-end}
.toast-container{position:fixed;top:16px;right:16px;z-index:200}
.toast{padding:8px 16px;border-radius:8px;margin-bottom:6px;font-size:.85rem;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.toast.success{background:#1a3a2a;border:1px solid var(--green);color:var(--green)}
.toast.error{background:#3a1a1a;border:1px solid var(--red);color:var(--red)}
</style>
</head>
<body>

<header>
  <h1><span>CV</span> Attendance</h1>
  <div class="stats">
    <span>Workers: <span class="badge green" id="wCount">0</span></span>
    <span>Guests: <span class="badge orange" id="gCount">0</span></span>
    <span>In: <span class="badge dim" id="inCount">0</span></span>
    <button class="cam-btn" id="camBtn" onclick="toggleCam()">🟢</button>
    <button class="btn primary" onclick="showReg()">+ Register</button>
    <span id="status" style="color:var(--text-dim);font-size:.8rem"></span>
  </div>
</header>

<div class="grid">
  <div class="video-card">
    <div class="card-header"><span>Camera</span><span class="live"><span class="dot"></span> LIVE</span></div>
    <div class="feed"><img src="http://localhost:5000/video_feed" alt="feed"></div>
  </div>
  <div>
    <div class="card">
      <div class="card-header"><span>Workers</span></div>
      <div class="table-wrap" id="workersBody"><div class="empty">Connecting...</div></div>
    </div>
    <div class="card">
      <div class="card-header"><span>Today</span></div>
      <div class="table-wrap" id="reportBody"><div class="empty">...</div></div>
    </div>
  </div>
</div>

<!-- modals -->
<div class="modal-overlay" id="regModal">
  <div class="modal">
    <h3>Register Worker</h3>
    <label>Name</label>
    <input type="text" id="regName" placeholder="Full name">
    <div class="hint">Look at the camera, then click Register. System takes 5 face samples.</div>
    <div class="btn-row">
      <button class="btn" onclick="closeReg()" style="border:1px solid var(--border);color:var(--text)">Cancel</button>
      <button class="btn primary" onclick="startReg()">Register</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="promoteModal">
  <div class="modal">
    <h3>New Face Detected</h3>
    <p id="promoteMsg" style="margin-bottom:12px;color:var(--text-dim)"></p>
    <label>Register as</label>
    <input type="text" id="promoteName" placeholder="Full name">
    <div class="btn-row">
      <button class="btn" onclick="dismiss()" style="border:1px solid var(--border);color:var(--text)">Dismiss</button>
      <button class="btn primary" onclick="promote()">Register</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toasts"></div>

<script>
const BASE = 'http://localhost:5000'
let pg = null

function $(id){return document.getElementById(id)}
function toast(m,t='info'){
  const e=document.createElement('div');e.className='toast '+t;e.textContent=m
  $('toasts').appendChild(e);setTimeout(()=>e.remove(),3500)
}

async function api(path,opts={}){
  const c=new AbortController();const t=setTimeout(()=>c.abort(),5000)
  try{
    const r=await fetch(BASE+path,{...opts,signal:c.signal})
    const d=await r.json()
    if(!r.ok) throw new Error(d.error||'Error')
    return d
  }finally{clearTimeout(t)}
}

async function toggleCam(){
  try{const r=await api('/api/camera/toggle',{method:'POST'});$('camBtn').textContent=r.enabled?'🟢':'🔴'}
  catch(e){}
}

function showReg(){$('regModal').classList.add('open');$('regName').value='';setTimeout(()=>$('regName').focus(),100)}
function closeReg(){$('regModal').classList.remove('open')}

async function startReg(){
  const n=$('regName').value.trim();if(!n)return toast('Enter name','error')
  try{
    const r=await api('/api/workers/capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})})
    toast(r.message,'success');closeReg();refresh()
  }catch(e){toast(e.message,'error')}
}

async function promote(){
  const n=$('promoteName').value.trim();if(!n)return toast('Enter name','error')
  try{
    const r=await api('/api/unknown/promote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})})
    toast(r.message,'success');closePromote();refresh()
  }catch(e){toast(e.message,'error')}
}

async function dismiss(){
  try{await api('/api/unknown/dismiss',{method:'POST'});closePromote()}
  catch(e){}
}

function closePromote(){$('promoteModal').classList.remove('open');pg=null}
function showPromote(gid){pg=gid;$('promoteMsg').textContent='Unknown face: '+gid;$('promoteName').value='';$('promoteModal').classList.add('open');setTimeout(()=>$('promoteName').focus(),100)}

async function delWorker(id){
  if(!confirm('Delete?'))return
  try{const r=await api('/api/workers/'+id,{method:'DELETE'});toast(r.message,'success');refresh()}
  catch(e){toast(e.message,'error')}
}

async function refresh(){
  try{
    const d=await api('/api/dashboard')
    $('wCount').textContent=d.worker_count
    $('gCount').textContent=d.guest_count
    $('inCount').textContent=d.currently_in
    $('camBtn').textContent=d.camera_enabled?'🟢':'🔴'
    $('status').textContent=d.now||''
    let h='<table><thead><tr><th>ID</th><th>Name</th><th>Status</th><th></th></tr></thead><tbody>'
    for(const w of d.workers)h+=`<tr><td>${w.id}</td><td>${w.name}</td><td><span class="status ${w.status}">${w.status.toUpperCase()}</span></td><td><button class="btn danger" onclick="delWorker('${w.id}')">X</button></td></tr>`
    h+='</tbody></table>'
    $('workersBody').innerHTML=h||'<div class="empty">No workers.</div>'
    if(d.unknown_guest&&!pg)showPromote(d.unknown_guest)
    const r=await api('/api/attendance/report')
    let rh='<table><thead><tr><th>Name</th><th>In</th><th>Out</th><th>Hours</th></tr></thead><tbody>'
    for(const x of r)rh+=`<tr><td>${x.name}</td><td>${x.first_in||'-'}</td><td>${x.last_out||'-'}</td><td>${x.total_hours||'-'}</td></tr>`
    rh+='</tbody></table>'
    $('reportBody').innerHTML=rh||'<div class="empty">No data.</div>'
  }catch(e){$('status').textContent='Server unreachable: '+e.message;$('workersBody').innerHTML='<div class="empty">Server not running</div>'}
}

refresh();setInterval(refresh,3000)
</script>
</body>
</html>
